<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoldRewards</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101014;
    color: white;
    text-align: center;
}

header {
    background: #19191f;
    padding: 25px;
    border-bottom: 2px solid gold;
}

h1 {
    color: gold;
}

.container {
    max-width: 420px;
    width: calc(100% - 30px);
    margin: 35px auto;
    padding: 25px;
    background: #202027;
    border-radius: 12px;
    box-sizing: border-box;
}

input {
    width: 90%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #555;
    border-radius: 7px;
    background: #303039;
    color: white;
    box-sizing: border-box;
}

input[type="file"] {
    max-width: 100%;
}

button {
    padding: 13px 20px;
    margin: 8px;
    border: none;
    border-radius: 7px;
    background: gold;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #e6b800;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.hidden {
    display: none;
}

#message,
#estadoDeposito {
    color: gold;
    overflow-wrap: anywhere;
}

#datos {
    white-space: pre-line;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
    <h1>GoldRewards</h1>
    <p>Gana, comparte y crece</p>
</header>

<div class="container" id="inicio">
    <h2>Bienvenido</h2>
    <button onclick="mostrar('registro')">Registrarse</button>
    <button onclick="mostrar('login')">Iniciar sesión</button>
</div>

<div class="container hidden" id="registro">
    <h2>Crear cuenta</h2>

    <input id="nombre" placeholder="Nombre completo">
    <input id="usuario" placeholder="Nombre de usuario">

    <button id="botonComprobar" onclick="comprobarUsuario()">
        Comprobar usuario
    </button>

    <input id="correo" type="email" placeholder="Correo electrónico">
    <input id="clave" type="password" placeholder="Contraseña">
    <input id="invitacion" placeholder="Código de invitación (opcional)">

    <button id="botonRegistro" onclick="registrar()">Crear cuenta</button>
    <button onclick="mostrar('inicio')">Volver</button>
</div>

<div class="container hidden" id="login">
    <h2>Iniciar sesión</h2>

    <input id="correoLogin" type="email" placeholder="Correo electrónico">
    <input id="claveLogin" type="password" placeholder="Contraseña">

    <button id="botonLogin" onclick="entrar()">Entrar</button>
    <button onclick="mostrar('inicio')">Volver</button>
</div>

<div class="container hidden" id="cuenta">
    <h2>Mi cuenta</h2>

    <p id="datos"></p>

    <hr>

    <h3>Depósito de membresía</h3>

    <p>Realiza tu transferencia a esta tarjeta:</p>

    <h2>9224069998634642</h2>

    <p>Titular: Cuenta del grupo de GoldRewards</p>

    <p>Después de transferir, sube la captura del comprobante:</p>

    <input
        type="file"
        id="comprobante"
        accept="image/jpeg,image/png,image/webp"
    >

    <button id="botonComprobante" onclick="subirComprobante()">
        Enviar comprobante
    </button>

    <p id="estadoDeposito"></p>

    <hr>

    <button onclick="salir()">Cerrar sesión</button>
</div>

<p id="message"></p>

<script>
const SUPABASE_URL = "https://yygykfyfpeetdzycirfs.supabase.co";

const SUPABASE_KEY = "sb_publishable_TAB8Yp-12ROav3Z4aoYoQQ_PH2Tet6L";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// Mostrar secciones
function mostrar(id) {
    document.querySelectorAll(".container").forEach(contenedor => {
        contenedor.classList.add("hidden");
    });

    document.getElementById(id).classList.remove("hidden");
    document.getElementById("message").textContent = "";
}

// Mensajes generales
function mensaje(texto) {
    document.getElementById("message").textContent = texto;
}

// Generar nombre único para el comprobante
function generarNombreArchivo(extension) {
    const valores = new Uint8Array(16);
    crypto.getRandomValues(valores);

    const identificador = Array.from(valores)
        .map(valor => valor.toString(16).padStart(2, "0"))
        .join("");

    return identificador + "." + extension;
}

// Comprobar nombre de usuario
async function comprobarUsuario() {
    const boton = document.getElementById("botonComprobar");

    const username = document.getElementById("usuario").value
        .trim()
        .toLowerCase();

    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        mensaje("Usa entre 3 y 20 letras, números o guiones bajos.");
        return;
    }

    boton.disabled = true;
    mensaje("Comprobando usuario...");

    try {
        const { data, error } = await supabaseClient.rpc(
            "check_username_available",
            { p_username: username }
        );

        if (error) {
            mensaje("No se pudo comprobar el usuario: " + error.message);
            return;
        }

        if (data && data[0] && data[0].available) {
            mensaje("¡Ese nombre de usuario está disponible!");
        } else {
            const sugerencias = data?.[0]?.suggestions || [];

            mensaje(
                "Ese usuario está ocupado. Sugerencias: " +
                sugerencias.join(", ")
            );
        }

    } catch (error) {
        mensaje("Error de conexión. Inténtalo de nuevo.");
    } finally {
        boton.disabled = false;
    }
}

// Registrar usuario
async function registrar() {
    const boton = document.getElementById("botonRegistro");

    const full_name = document.getElementById("nombre").value.trim();

    const username = document.getElementById("usuario").value
        .trim()
        .toLowerCase();

    const email = document.getElementById("correo").value.trim();

    const password = document.getElementById("clave").value;

    const referral_code = document.getElementById("invitacion").value.trim();

    if (!full_name || !username || !email || !password) {
        mensaje("Completa todos los campos obligatorios.");
        return;
    }

    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        mensaje("El nombre de usuario no es válido.");
        return;
    }

    if (password.length < 6) {
        mensaje("La contraseña debe tener al menos 6 caracteres.");
        return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        mensaje("Introduce un correo electrónico válido.");
        return;
    }

    boton.disabled = true;
    mensaje("Comprobando disponibilidad...");

    try {
        const { data: disponibilidad, error: errorUsuario } =
            await supabaseClient.rpc("check_username_available", {
                p_username: username
            });

        if (errorUsuario) {
            mensaje("No se pudo comprobar el usuario: " + errorUsuario.message);
            return;
        }

        if (!disponibilidad?.[0]?.available) {
            mensaje("Ese nombre de usuario ya está ocupado.");
            return;
        }

        mensaje("Creando tu cuenta...");

        const { error } = await supabaseClient.auth.signUp({
            email,
            password,
            options: {
                emailRedirectTo: "https://goldrewards.github.io/goldrewards/",
                data: {
                    full_name,
                    username,
                    referral_code
                }
            }
        });

        if (error) {
            mensaje("Error al crear la cuenta: " + error.message);
            return;
        }

        document.getElementById("nombre").value = "";
        document.getElementById("usuario").value = "";
        document.getElementById("correo").value = "";
        document.getElementById("clave").value = "";
        document.getElementById("invitacion").value = "";

        mostrar("login");

        mensaje(
            "¡Bienvenido a GoldRewards! Inicia sesión para acceder a tu cuenta."
        );

    } catch (error) {
        mensaje("Error de conexión. Inténtalo de nuevo.");
    } finally {
        boton.disabled = false;
    }
}

// Iniciar sesión
async function entrar() {
    const boton = document.getElementById("botonLogin");

    const email = document.getElementById("correoLogin").value.trim();

    const password = document.getElementById("claveLogin").value;

    if (!email || !password) {
        mensaje("Escribe tu correo y contraseña.");
        return;
    }

    boton.disabled = true;
    mensaje("Iniciando sesión...");

    try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            mensaje("No se pudo iniciar sesión: " + error.message);
            return;
        }

        mostrar("cuenta");
        mensaje("¡Bienvenido a GoldRewards!");

        const { data: perfil, error: errorPerfil } = await supabaseClient
            .from("profiles")
            .select("full_name, username, role, referral_code")
            .eq("id", data.user.id)
            .maybeSingle();

        if (errorPerfil || !perfil) {
            document.getElementById("datos").textContent =
                "Sesión iniciada. No se pudo cargar el perfil.";
            return;
        }

        document.getElementById("datos").textContent =
            "Nombre: " + (perfil.full_name || "") +
            "\nUsuario: @" + (perfil.username || "") +
            "\nRol: " + (perfil.role || "user") +
            "\nCódigo de invitación: " + (perfil.referral_code || "Pendiente");

    } catch (error) {
        mensaje("Error de conexión. Inténtalo de nuevo.");
    } finally {
        boton.disabled = false;
    }
}

// Enviar comprobante de depósito
async function subirComprobante() {
    const archivo = document.getElementById("comprobante").files[0];

    const estado = document.getElementById("estadoDeposito");

    const boton = document.getElementById("botonComprobante");

    if (!archivo) {
        estado.textContent = "Selecciona primero la captura de tu transferencia.";
        return;
    }

    const { data: sesion, error: errorSesion } =
        await supabaseClient.auth.getUser();

    if (errorSesion || !sesion.user) {
        estado.textContent = "Debes iniciar sesión.";
        return;
    }

    const usuario = sesion.user;

    const tiposPermitidos = [
        "image/jpeg",
        "image/png",
        "image/webp"
    ];

    if (!tiposPermitidos.includes(archivo.type)) {
        estado.textContent = "Solo se permiten imágenes JPG, PNG o WEBP.";
        return;
    }

    if (archivo.size > 5 * 1024 * 1024) {
        estado.textContent = "La imagen no puede pesar más de 5 MB.";
        return;
    }

    boton.disabled = true;
    estado.textContent = "Enviando comprobante...";

    try {
        const extension = archivo.type === "image/jpeg" ? "jpg" :
            archivo.type === "image/png" ? "png" : "webp";

        const ruta = usuario.id + "/" + generarNombreArchivo(extension);

        // Subir imagen al almacenamiento privado
        const { error: subidaError } = await supabaseClient.storage
            .from("payment_receipts")
            .upload(ruta, archivo, {
                contentType: archivo.type,
                upsert: false
            });

        if (subidaError) {
            estado.textContent =
                "Error al subir el comprobante: " + subidaError.message;
            return;
        }

        // Registrar solicitud de pago
        const { error: registroError } = await supabaseClient
            .from("payment_requests")
            .insert({
                user_id: usuario.id,
                plan: "membresia",
                amount_cup: 100,
                receipt_url: ruta,
                status: "pending"
            });

        if (registroError) {
            estado.textContent =
                "La imagen se subió, pero no se pudo registrar la solicitud: " +
                registroError.message;
            return;
        }

        estado.textContent =
            "¡Comprobante enviado correctamente! Tu depósito está pendiente de aprobación.";

        document.getElementById("comprobante").value = "";

    } catch (error) {
        estado.textContent = "Ocurrió un error: " + error.message;
    } finally {
        boton.disabled = false;
    }
}

// Cerrar sesión
async function salir() {
    try {
        const { error } = await supabaseClient.auth.signOut();

        if (error) {
            mensaje("No se pudo cerrar la sesión: " + error.message);
            return;
        }

        document.getElementById("datos").textContent = "";
        document.getElementById("estadoDeposito").textContent = "";
        document.getElementById("comprobante").value = "";

        mostrar("inicio");
        mensaje("Has cerrado sesión.");

    } catch (error) {
        mensaje("Error al cerrar sesión.");
    }
}
</script>

</body>
</html>
